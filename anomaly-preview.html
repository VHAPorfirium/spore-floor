<!DOCTYPE html>
<!--
  Ferramenta de desenvolvimento: mostra uma anomalia específica sem precisar jogar até ela aparecer.
  Exemplo: anomaly-preview.html?anomaly=mold-patch-on-wall
  A câmera centraliza sozinha na anomalia. Para forçar outra posição: &cameraPositionX=1570
  Sem o parâmetro anomaly, mostra o corredor normal e lista as anomalias no console.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anomaly preview</title>
  <style>html, body { margin: 0; height: 100%; background: #000000; display: flex; align-items: center; justify-content: center; }</style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <script type="module">
    import { GameConfiguration } from "./src/domain/GameConfiguration.js";
    import { FloorGenerator } from "./src/domain/FloorGenerator.js";
    import { createAnomalyCatalog } from "./src/domain/anomalies/anomalyCatalog.js";
    import { GameSession } from "./src/application/GameSession.js";
    import { CanvasHallwayRenderer } from "./src/infrastructure/CanvasHallwayRenderer.js";

    const previewFloorNumber = 7;
    const defaultCameraPositionX = 1200;
    // O jogador fica um pouco à esquerda para não tapar a anomalia; a câmera segue o jogador.
    const playerDistanceLeftOfFocusInPixels = 180;
    const urlParameters = new URLSearchParams(window.location.search);
    const requestedAnomalyIdentifier = urlParameters.get("anomaly");

    const anomalyCatalog = createAnomalyCatalog();
    const anomalyToPreview = anomalyCatalog.find((anomaly) => anomaly.anomalyIdentifier === requestedAnomalyIdentifier);
    if (!anomalyToPreview) {
      console.info("Available anomalies:", anomalyCatalog.map((anomaly) => anomaly.anomalyIdentifier));
    }

    const requestedCameraPositionX = urlParameters.has("cameraPositionX")
      ? Number(urlParameters.get("cameraPositionX"))
      : anomalyToPreview?.focusPositionX ?? defaultCameraPositionX;

    const anomaliesToUse = anomalyToPreview ? [anomalyToPreview] : [];
    const alwaysPickFirstAnomaly = () => 0;
    const floorGenerator = new FloorGenerator(anomaliesToUse, 1, GameConfiguration.startingFloorNumber, alwaysPickFirstAnomaly);
    const gameSession = new GameSession(GameConfiguration, floorGenerator);
    gameSession.currentFloorState = floorGenerator.generateFloor(previewFloorNumber);
    gameSession.player.teleportTo(requestedCameraPositionX - playerDistanceLeftOfFocusInPixels);

    const canvasHallwayRenderer = new CanvasHallwayRenderer(document.getElementById("game-canvas"), GameConfiguration, true);

    // Continua desenhando para as anomalias animadas (luz piscando, esporos) aparecerem.
    function renderPreviewFrame(currentFrameTimestampInMilliseconds) {
      canvasHallwayRenderer.render(gameSession, currentFrameTimestampInMilliseconds / 1000);
      requestAnimationFrame(renderPreviewFrame);
    }
    requestAnimationFrame(renderPreviewFrame);
  </script>
</body>
</html>
